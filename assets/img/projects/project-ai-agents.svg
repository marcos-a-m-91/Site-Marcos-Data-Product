<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAI" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c"/>
      <stop offset="100%" stop-color="#0e172a"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGradAI)"/>
  <rect x="0" y="0" width="600" height="340" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Bar -->
  <rect x="24" y="20" width="552" height="28" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="42" cy="34" r="4" fill="#38bdf8" opacity="0.9"/>
  <circle cx="56" cy="34" r="4" fill="#6366f1" opacity="0.6"/>
  <text x="76" y="38" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">AGENT WORKFLOW • RAG ARCHITECTURE</text>
  <rect x="460" y="26" width="100" height="16" rx="4" fill="#1e3a5f"/>
  <text x="470" y="38" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" font-weight="600">LLM PIPELINE: ONLINE</text>

  <!-- Metric Badges Row -->
  <g transform="translate(24, 60)">
    <rect x="0" y="0" width="176" height="50" rx="6" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
    <text x="14" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">RESOLUTION SLA</text>
    <text x="14" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">45 seg <tspan fill="#34d399" font-size="10">-82%</tspan></text>

    <rect x="188" y="0" width="176" height="50" rx="6" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
    <text x="202" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">RETRIEVAL RELEVANCE</text>
    <text x="202" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">96.8% <tspan fill="#38bdf8" font-size="10">RAG</tspan></text>

    <rect x="376" y="0" width="176" height="50" rx="6" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
    <text x="390" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">TICKETS DEFLECTION</text>
    <text x="390" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">40.2% <tspan fill="#a78bfa" font-size="10">LEVEL 1</tspan></text>
  </g>

  <!-- Flowchart Diagram Area -->
  <rect x="24" y="122" width="552" height="196" rx="8" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#1e2d42" stroke-width="1" stroke-dasharray="2 3" opacity="0.4">
    <line x1="40" y1="160" x2="550" y2="160"/>
    <line x1="40" y1="220" x2="550" y2="220"/>
    <line x1="40" y1="280" x2="550" y2="280"/>
  </g>

  <!-- Flow Diagram Nodes -->
  <g transform="translate(44, 150)">
    <!-- Node 1: Input Query -->
    <rect x="0" y="26" width="100" height="54" rx="8" fill="#0f2238" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="14" y="48" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" font-weight="600">INPUT SOURCE</text>
    <text x="14" y="66" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Chat / API</text>

    <!-- Connector 1 -->
    <path d="M 100 53 L 136 53" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Node 2: Vector DB RAG -->
    <rect x="136" y="26" width="114" height="54" rx="8" fill="#132742" stroke="#2563eb" stroke-width="1.5"/>
    <text x="150" y="48" fill="#60a5fa" font-family="Inter, sans-serif" font-size="9" font-weight="600">VECTOR STORE</text>
    <text x="150" y="66" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="700">Embeddings</text>

    <!-- Connector 2 -->
    <path d="M 250 53 L 286 53" stroke="#22d3ee" stroke-width="2"/>

    <!-- Node 3: LLM Engine -->
    <rect x="286" y="14" width="118" height="78" rx="8" fill="url(#nodeGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="300" y="38" fill="#e0e7ff" font-family="Inter, sans-serif" font-size="9" font-weight="600">AGENT CORE</text>
    <text x="300" y="58" fill="#ffffff" font-family="Inter, sans-serif" font-size="14" font-weight="800">LLM Reasoning</text>
    <text x="300" y="76" fill="#c7d2fe" font-family="Inter, sans-serif" font-size="9">Chain of Thought</text>

    <!-- Connector 3 -->
    <path d="M 404 53 L 440 53" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>

    <!-- Node 4: Action / ERP Integration -->
    <rect x="440" y="26" width="102" height="54" rx="8" fill="#0f2238" stroke="#1e3a5f" stroke-width="1.5"/>
    <text x="452" y="48" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" font-weight="600">OUTPUT ACTION</text>
    <text x="452" y="66" fill="#34d399" font-family="Inter, sans-serif" font-size="12" font-weight="700">ERP Workflow</text>
  </g>

  <!-- Bottom Log Row -->
  <g transform="translate(44, 282)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="10">> [Agent] Context retrieved: 4 policy docs (cosine sim: 0.94) • Decision generated in 420ms</text>
  </g>
</svg>
