    <text x="14" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">EVENT RECOVERY</text>
    <text x="14" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">+92.4% <tspan fill="#34d399" font-size="10">UNBLOCKED</tspan></text>

    <rect x="188" y="0" width="176" height="50" rx="6" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
    <text x="202" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">PAID MEDIA ROAS</text>
    <text x="202" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">4.82x <tspan fill="#38bdf8" font-size="10">+18%</tspan></text>

    <rect x="376" y="0" width="176" height="50" rx="6" fill="#091424" stroke="#1a2d47" stroke-width="1"/>
    <text x="390" y="20" fill="#64748b" font-family="Inter, sans-serif" font-size="9" font-weight="600">DATA DELAY SLA</text>
    <text x="390" y="40" fill="#ffffff" font-family="Inter, sans-serif" font-size="15" font-weight="700">62 ms <tspan fill="#38bdf8" font-size="10">STREAM</tspan></text>
