      <stop offset="0%" stop-color="#071222"/>
      <stop offset="100%" stop-color="#0c1b30"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="340" fill="url(#bgGradTrack)"/>
