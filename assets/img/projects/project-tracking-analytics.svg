  <!-- Top Bar -->
  <rect x="24" y="20" width="552" height="28" rx="6" fill="#0f1f38" stroke="#1e3a5f" stroke-width="1"/>
  <circle cx="42" cy="34" r="4" fill="#38bdf8" opacity="0.9"/>
  <text x="56" y="38" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10" font-weight="600" letter-spacing="0.5">SERVER-SIDE TRACKING • FIRST-PARTY DATA PIPELINE</text>
  <rect x="466" y="26" width="94" height="16" rx="4" fill="#0e342c"/>
  <text x="476" y="38" fill="#34d399" font-family="Inter, sans-serif" font-size="9" font-weight="600">GTM SS: SYNCED</text>

