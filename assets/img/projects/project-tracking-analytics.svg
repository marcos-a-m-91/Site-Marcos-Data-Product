    <rect x="0" y="0" width="512" height="48" rx="6" fill="#070f1a" stroke="#1e2d42" stroke-width="1"/>
    <circle cx="20" cy="24" r="5" fill="#22c55e"/>
    <text x="34" y="22" fill="#e2e8f0" font-family="monospace" font-size="10">POST /mp/collect • event: purchase • value: R$ 429.00</text>
    <text x="34" y="38" fill="#64748b" font-family="monospace" font-size="9">attribution: verified • server_timestamp: 1726059281 • latency: 48ms</text>
    <text x="440" y="30" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="700">100% VALID</text>
