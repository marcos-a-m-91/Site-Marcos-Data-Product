    <text x="14" y="22" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" font-weight="600">WEB &amp; APP CLIENTS</text>
    <text x="14" y="42" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">1st-Party Domain</text>
    <text x="14" y="60" fill="#38bdf8" font-family="monospace" font-size="10">data.domain.com</text>

    <path d="M 130 37 L 175 37" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Middle: GTM Server Container -->
    <rect x="175" y="0" width="160" height="74" rx="8" fill="#132744" stroke="#2563eb" stroke-width="1.5"/>
    <text x="189" y="22" fill="#60a5fa" font-family="Inter, sans-serif" font-size="9" font-weight="600">GCP CLOUD RUN</text>
    <text x="189" y="42" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="700">GTM Server-Side</text>
    <text x="189" y="60" fill="#94a3b8" font-family="Inter, sans-serif" font-size="10">Sanitize &amp; Hash PII</text>

    <!-- Splits -->
    <path d="M 335 24 L 375 14" stroke="#22d3ee" stroke-width="2"/>
    <path d="M 335 50 L 375 60" stroke="#38bdf8" stroke-width="2"/>

    <!-- Right Destination 1: BigQuery -->
    <rect x="375" y="-6" width="140" height="38" rx="6" fill="#0f2b48" stroke="#1e40af" stroke-width="1.2"/>
    <text x="387" y="14" fill="#93c5fd" font-family="Inter, sans-serif" font-size="9" font-weight="600">BIGQUERY WAREHOUSE</text>
    <text x="387" y="27" fill="#ffffff" font-family="monospace" font-size="10">raw_events_stream</text>

    <!-- Right Destination 2: Ad Platforms API -->
    <rect x="375" y="42" width="140" height="38" rx="6" fill="#0f2b48" stroke="#1e40af" stroke-width="1.2"/>
    <text x="387" y="58" fill="#93c5fd" font-family="Inter, sans-serif" font-size="9" font-weight="600">CONVERSIONS API</text>
    <text x="387" y="71" fill="#ffffff" font-family="monospace" font-size="10">CAPI / GA4 Server</text>
  </g>

