<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Book Cover Background -->
  <rect width="300" height="450" fill="#0d1117" rx="4"/>
  
  <!-- Subtle Spine Shadow -->
  <rect x="0" y="0" width="16" height="450" fill="#ffffff" opacity="0.06"/>
  <line x1="16" y1="0" x2="16" y2="450" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Top Tag -->
  <text x="150" y="55" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="600" letter-spacing="1">RICHARD RUMELT</text>

  <!-- Big Graphic Typography Title -->
  <g transform="translate(150, 140)">
    <!-- GOOD STRATEGY -->
    <text x="0" y="0" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">GOOD</text>
    <text x="0" y="38" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">STRATEGY</text>
    
    <!-- Strike/divider bar -->
    <rect x="-100" y="60" width="200" height="3" fill="#ffffff" opacity="0.9"/>

    <!-- BAD STRATEGY inverted or angled effect -->
    <text x="0" y="105" fill="#94a3b8" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">BAD</text>
    <text x="0" y="142" fill="#94a3b8" font-family="Impact, Arial Black, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="2">STRATEGY</text>
  </g>

  <!-- Subtitle -->
  <text x="150" y="360" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="500">THE DIFFERENCE AND</text>
  <text x="150" y="378" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="500">WHY IT MATTERS</text>
  
  <!-- Accent Line at Bottom -->
  <line x1="80" y1="410" x2="220" y2="410" stroke="#3b82f6" stroke-width="2"/>
</svg>
