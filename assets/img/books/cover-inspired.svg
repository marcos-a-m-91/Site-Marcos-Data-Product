<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background Inspired (Silicon Valley Blue / Slate) -->
  <rect width="300" height="450" fill="#0f2b48" rx="4"/>
  <rect x="0" y="0" width="300" height="450" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="16" height="450" fill="#000" opacity="0.15"/>
  <line x1="16" y1="0" x2="16" y2="450" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Header Category / Edition -->
  <text x="150" y="60" fill="#38bdf8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="700" letter-spacing="2">SECOND EDITION</text>

  <!-- Big Bold Title: INSPIRED -->
  <text x="150" y="145" fill="#ffffff" font-family="Inter, Helvetica, sans-serif" font-size="38" font-weight="900" text-anchor="middle" letter-spacing="2">INSPIRED</text>

  <!-- Decorative Accent Bar -->
  <rect x="60" y="165" width="180" height="4" fill="#38bdf8" rx="2"/>

  <!-- Subtitle -->
  <text x="150" y="210" fill="#e2e8f0" font-family="Georgia, serif" font-size="13" text-anchor="middle" font-style="italic">How to Create Tech Products</text>
  <text x="150" y="230" fill="#e2e8f0" font-family="Georgia, serif" font-size="13" text-anchor="middle" font-style="italic">Customers Love</text>

  <!-- Geometric Innovation Symbol -->
  <g transform="translate(150, 290)">
    <circle cx="0" cy="0" r="28" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="0,-18 16,10 -16,10" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="2" r="4" fill="#38bdf8"/>
  </g>

  <!-- Author Name -->
  <text x="150" y="380" fill="#ffffff" font-family="Inter, sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">MARTY CAGAN</text>
  <text x="150" y="405" fill="#94a3b8" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="600" letter-spacing="1.5">SILICON VALLEY PRODUCT GROUP</text>
</svg>
