<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Book Cover Background -->
  <rect width="300" height="450" fill="#faf8f5" rx="4"/>
  <rect x="0" y="0" width="300" height="450" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Subtle Spine Shadow -->
  <rect x="0" y="0" width="16" height="450" fill="black" opacity="0.04"/>
  <line x1="16" y1="0" x2="16" y2="450" stroke="#000" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Top Note -->
  <text x="150" y="55" fill="#64748b" font-family="'Times New Roman', Georgia, serif" font-size="10" text-anchor="middle" font-style="italic" letter-spacing="0.5">THE INTERNATIONAL BESTSELLER</text>

  <!-- Title -->
  <text x="150" y="125" fill="#1e293b" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="-0.5">Thinking,</text>
  <text x="150" y="160" fill="#1e293b" font-family="Georgia, serif" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="-0.5">Fast and Slow</text>

  <!-- Pencil Illustration in Center -->
  <g transform="translate(70, 220)">
    <!-- Pencil Body (yellow/gold) -->
    <rect x="20" y="0" width="115" height="10" fill="#eab308" rx="1"/>
    <!-- Pencil stripes -->
    <rect x="20" y="2" width="115" height="2" fill="#ca8a04"/>
    <rect x="20" y="6" width="115" height="2" fill="#facc15"/>
    <!-- Ferrule (metal band) -->
    <rect x="135" y="0" width="10" height="10" fill="#94a3b8"/>
    <!-- Eraser -->
    <rect x="145" y="0" width="15" height="10" rx="3" fill="#f43f5e"/>
    <!-- Wooden Point -->
    <polygon points="20,0 0,5 20,10" fill="#fde047"/>
    <!-- Graphite Tip -->
    <polygon points="8,3 0,5 8,7" fill="#1e293b"/>
  </g>

  <!-- Author Name -->
  <text x="150" y="325" fill="#334155" font-family="Georgia, serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">DANIEL</text>
  <text x="150" y="350" fill="#334155" font-family="Georgia, serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">KAHNEMAN</text>

  <!-- Bottom subtitle -->
  <text x="150" y="405" fill="#94a3b8" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" letter-spacing="1">WINNER OF THE NOBEL PRIZE</text>
</svg>
