<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" width="100%" height="100%">
  <!-- Background White / Pure Editorial -->
  <rect width="300" height="450" fill="#fafafa" rx="4"/>
  <rect x="0" y="0" width="300" height="450" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Spine Shadow -->
  <rect x="0" y="0" width="16" height="450" fill="#000" opacity="0.04"/>
  <line x1="16" y1="0" x2="16" y2="450" stroke="#000" stroke-opacity="0.05" stroke-width="1"/>

  <!-- Top Tag -->
  <text x="150" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" font-weight="700" letter-spacing="1.5">BEST-SELLER DO NEW YORK TIMES</text>

  <!-- Author Name at Top -->
  <text x="150" y="105" fill="#0f172a" font-family="Georgia, serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">NASSIM NICHOLAS</text>
  <text x="150" y="132" fill="#0f172a" font-family="Georgia, serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">TALEB</text>

  <line x1="100" y1="150" x2="200" y2="150" stroke="#0f172a" stroke-width="2"/>

  <!-- Black Swan Vector Silhouette -->
  <g transform="translate(150, 240) scale(1.1)">
    <!-- Swan body and wings in deep black -->
    <path d="M -30 20 
             C -40 10, -35 -10, -10 -5
             C 10 -2, 25 15, 35 10
             C 25 25, 0 30, -30 20 Z" fill="#0b1320"/>
    <!-- Elegant neck and head -->
    <path d="M 25 15
             C 32 5, 20 -20, 10 -35
             C 5 -42, 14 -48, 18 -45
             C 22 -40, 20 -30, 28 -15
             C 34 -5, 40 5, 30 20 Z" fill="#0b1320"/>
    <!-- Wing feathers accent -->
    <path d="M -15 0 C -25 -15, -5 -20, 10 -10 Z" fill="#1e293b"/>
    <!-- Red/amber beak accent -->
    <polygon points="18,-45 28,-42 22,-38" fill="#ef4444"/>
  </g>

  <!-- Title: A LÓGICA DO CISNE NEGRO -->
  <text x="150" y="340" fill="#0b1320" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="900" text-anchor="middle" letter-spacing="0.5">A LÓGICA DO</text>
  <text x="150" y="368" fill="#0b1320" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="900" text-anchor="middle" letter-spacing="1">CISNE NEGRO</text>

  <!-- Subtitle -->
  <text x="150" y="405" fill="#64748b" font-family="Georgia, serif" font-size="10" text-anchor="middle" font-style="italic">O Impacto do Altamente Improvável</text>
</svg>
