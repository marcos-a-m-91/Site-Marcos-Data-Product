<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="100%" height="100%">
  <defs>
    <filter id="distShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="320" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="16" font-weight="bold" fill="#1f2328">Distribuição de Avaliações (Opção 2 - 120 avaliações)</text>
  <text x="40" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">A maioria absoluta dos hóspedes avaliou com nota máxima (Moda = 5 estrelas)</text>

  <!-- Ratings Bars -->
  <!-- 5 Estrelas -->
  <g transform="translate(40, 100)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#1f2328">5 estrelas</text>
    <rect x="80" y="4" width="480" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="80" y="4" width="410" height="16" rx="8" fill="#1a7f37"/>
    <text x="580" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#1a7f37">85% (102)</text>
    <text x="660" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#8250df">★ MODA</text>
  </g>

  <!-- 4 Estrelas -->
  <g transform="translate(40, 140)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#1f2328">4 estrelas</text>
    <rect x="80" y="4" width="480" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="80" y="4" width="55" height="16" rx="8" fill="#656d76"/>
    <text x="580" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">11% (13)</text>
  </g>

  <!-- 3 Estrelas -->
  <g transform="translate(40, 180)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#1f2328">3 estrelas</text>
    <rect x="80" y="4" width="480" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="80" y="4" width="12" height="16" rx="8" fill="#656d76"/>
    <text x="580" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">2% (3)</text>
  </g>

  <!-- 2 Estrelas -->
  <g transform="translate(40, 220)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#1f2328">2 estrelas</text>
    <rect x="80" y="4" width="480" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="80" y="4" width="4" height="16" rx="8" fill="#656d76"/>
    <text x="580" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">0.8% (1)</text>
  </g>

  <!-- 1 Estrela (Outlier) -->
  <g transform="translate(40, 260)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#cf222e">1 estrela</text>
    <rect x="80" y="4" width="480" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="80" y="4" width="5" height="16" rx="8" fill="#cf222e"/>
    <text x="580" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#cf222e">0.8% (1)</text>
    <text x="660" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#cf222e">⚠ Outlier</text>
  </g>
</svg>
