<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f8fa"/>
      <stop offset="100%" stop-color="#edf2f7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#grid)" opacity="0.6"/>

  <!-- Subtle glow behind star schema -->
  <circle cx="400" cy="225" r="160" fill="#fef3c7" opacity="0.7" filter="blur(30px)"/>

  <!-- Star Schema Connectors -->
  <line x1="400" y1="225" x2="400" y2="90" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="225" x2="400" y2="360" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="225" x2="180" y2="225" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="225" x2="620" y2="225" stroke="#d97706" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="400" y1="225" x2="240" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="400" y1="225" x2="560" y2="120" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Dim: Calendario (Top) -->
  <g transform="translate(320, 50)" filter="url(#shadow)">
    <rect width="160" height="70" rx="12" fill="url(#nodeGrad)" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#fef3c7"/>
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">📅</text>
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#1f2328">dCalendario</text>
    <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#656d76">1:Muitos</text>
  </g>

  <!-- Dim: Cliente (Left) -->
  <g transform="translate(90, 190)" filter="url(#shadow)">
    <rect width="160" height="70" rx="12" fill="url(#nodeGrad)" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#fef3c7"/>
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">👤</text>
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#1f2328">dCliente</text>
    <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#656d76">Segmento, Região</text>
  </g>

  <!-- Dim: Produto (Right) -->
  <g transform="translate(550, 190)" filter="url(#shadow)">
    <rect width="160" height="70" rx="12" fill="url(#nodeGrad)" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#fef3c7"/>
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">📦</text>
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#1f2328">dProduto</text>
    <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#656d76">SKU, Categoria</text>
  </g>

  <!-- Dim: Canal (Bottom) -->
  <g transform="translate(320, 330)" filter="url(#shadow)">
    <rect width="160" height="70" rx="12" fill="url(#nodeGrad)" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="16" y="16" width="32" height="32" rx="8" fill="#fef3c7"/>
    <text x="32" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" fill="#d97706" text-anchor="middle" font-weight="bold">🌐</text>
    <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="bold" fill="#1f2328">dCanalVendas</text>
    <text x="60" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#656d76">E-commerce, B2B</text>
  </g>

  <!-- Central Fact: fVendas -->
  <g transform="translate(310, 180)" filter="url(#shadow)">
    <rect width="180" height="90" rx="16" fill="url(#goldGrad)"/>
    <rect x="15" y="15" width="150" height="60" rx="10" fill="#ffffff" opacity="0.15"/>
    <text x="90" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">fVendas</text>
    <text x="90" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="11" fill="#fef3c7" text-anchor="middle">Fato Central • VertiPaq</text>
  </g>
</svg>
