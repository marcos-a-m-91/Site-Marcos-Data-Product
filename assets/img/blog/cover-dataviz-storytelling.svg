<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="vizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#e6f7ec"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="vizShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#166534" flood-opacity="0.1"/>
    </filter>
    <pattern id="vizGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dcfce7" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#vizBg)"/>
  <rect width="800" height="450" fill="url(#vizGrid)"/>

  <!-- Chart Panel Mockup -->
  <g transform="translate(100, 60)" filter="url(#vizShadow)">
    <rect width="600" height="330" rx="20" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>

    <!-- Window controls -->
    <circle cx="28" cy="28" r="5" fill="#f87171"/>
    <circle cx="44" cy="28" r="5" fill="#facc15"/>
    <circle cx="60" cy="28" r="5" fill="#4ade80"/>
    <text x="300" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Storytelling com Dados • Painel de Decisão</text>
    <line x1="0" y1="50" x2="600" y2="50" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Insight Headline Banner -->
    <rect x="25" y="70" width="550" height="50" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="45" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#15803d">INSIGHT ACIONÁVEL</text>
    <text x="45" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="600" fill="#0f172a">Vendas B2B cresceram +38% após automação de follow-up no Q3</text>

    <!-- Visual Chart Area -->
    <!-- Gridlines -->
    <line x1="50" y1="170" x2="550" y2="170" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="230" x2="550" y2="230" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="50" y1="290" x2="550" y2="290" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Area under curve -->
    <path d="M 60 270 Q 150 250, 220 220 T 380 180 T 520 140 L 520 290 L 60 290 Z" fill="url(#chartGrad)"/>
    <!-- Line curve -->
    <path d="M 60 270 Q 150 250, 220 220 T 380 180 T 520 140" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Markers -->
    <circle cx="220" cy="220" r="5" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <circle cx="380" cy="180" r="5" fill="#ffffff" stroke="#15803d" stroke-width="2.5"/>
    <circle cx="520" cy="140" r="7" fill="#15803d" stroke="#ffffff" stroke-width="3"/>

    <!-- Highlight Callout on Top Marker -->
    <g transform="translate(450, 95)" filter="url(#vizShadow)">
      <rect width="105" height="35" rx="8" fill="#15803d"/>
      <text x="52" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+38% Meta</text>
    </g>

    <!-- Clean Axis Labels -->
    <text x="60" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" fill="#94a3b8">Jan</text>
    <text x="220" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" fill="#94a3b8">Abr</text>
    <text x="380" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" fill="#94a3b8">Jul</text>
    <text x="520" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#15803d">Out</text>
  </g>
</svg>
