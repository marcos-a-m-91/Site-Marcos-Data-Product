<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMath" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11376e"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <pattern id="mathGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bgMath)"/>
  <rect width="800" height="450" fill="url(#mathGrid)"/>

  <!-- Glow effect -->
  <circle cx="400" cy="225" r="180" fill="#dbeafe" opacity="0.6" filter="blur(40px)"/>

  <!-- Gaussian / Skewed Distribution Curve -->
  <path d="M 120 330 Q 260 330 320 230 Q 360 130 420 120 Q 480 130 520 240 Q 580 330 700 330" 
        fill="none" stroke="#11376e" stroke-width="4" stroke-linecap="round"/>
  
  <path d="M 120 330 Q 260 330 320 230 Q 360 130 420 120 Q 480 130 520 240 Q 580 330 700 330 L 700 330 L 120 330 Z" 
        fill="#1f6feb" fill-opacity="0.08"/>

  <!-- Vertical lines for Mean, Median, Mode -->
  <!-- MODA (Peak at 420) -->
  <line x1="420" y1="120" x2="420" y2="330" stroke="#8250df" stroke-width="2.5" stroke-dasharray="6,4"/>
  <g transform="translate(370, 75)" filter="url(#cardShadow)">
    <rect width="100" height="34" rx="8" fill="#8250df"/>
    <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Moda: 5.0</text>
  </g>

  <!-- MEDIANA (around 450) -->
  <line x1="450" y1="145" x2="450" y2="330" stroke="#1a7f37" stroke-width="2.5" stroke-dasharray="6,4"/>
  <g transform="translate(480, 140)" filter="url(#cardShadow)">
    <rect width="110" height="34" rx="8" fill="#1a7f37"/>
    <text x="55" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Mediana: 4.9</text>
  </g>

  <!-- MEDIA (pulled down by outlier to 480) -->
  <line x1="485" y1="180" x2="485" y2="330" stroke="#9a6700" stroke-width="2.5" stroke-dasharray="6,4"/>
  <g transform="translate(560, 205)" filter="url(#cardShadow)">
    <rect width="105" height="34" rx="8" fill="#9a6700"/>
    <text x="52" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Média: 4.6</text>
  </g>

  <!-- Baseline -->
  <line x1="100" y1="330" x2="720" y2="330" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Left Comparison Box: Airbnb 5.0 vs 4.8 -->
  <g transform="translate(90, 80)" filter="url(#cardShadow)">
    <rect width="210" height="110" rx="16" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="18" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#656d76">CASO AIRBNB</text>
    
    <g transform="translate(18, 45)">
      <rect width="80" height="48" rx="8" fill="#fffbeb" stroke="#fef08a"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="bold" fill="#b45309" text-anchor="middle">★ 5.0</text>
      <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" fill="#92400e" text-anchor="middle">10 reviews</text>
    </g>

    <g transform="translate(110, 45)">
      <rect width="80" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="40" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">★ 4.8</text>
      <text x="40" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="9" fill="#166534" text-anchor="middle">120 reviews</text>
    </g>
  </g>

  <!-- Outlier marker (Virginia / Extreme event) -->
  <circle cx="680" cy="330" r="6" fill="#ef4444"/>
  <text x="680" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">Outlier</text>
</svg>
