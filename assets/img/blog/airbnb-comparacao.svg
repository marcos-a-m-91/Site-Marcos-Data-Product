<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="100%" height="100%">
  <defs>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="760" height="300" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title -->
  <text x="380" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="16" font-weight="bold" fill="#1f2328" text-anchor="middle">Qual acomodação você escolheria em São Paulo?</text>

  <!-- Card Opção 1 -->
  <g transform="translate(50, 70)" filter="url(#boxShadow)">
    <rect width="300" height="190" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="20" y="20" width="260" height="75" rx="8" fill="#f1f5f9"/>
    <text x="150" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" fill="#64748b" text-anchor="middle">Apartamento em Pinheiros</text>
    
    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="15" font-weight="bold" fill="#1f2328">Opção 1</text>
    <text x="24" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">R$ 380 / noite</text>
    
    <g transform="translate(24, 155)">
      <rect width="115" height="26" rx="6" fill="#fffbeb" stroke="#fef08a"/>
      <text x="57" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#b45309" text-anchor="middle">★ 5.0 (10 avaliações)</text>
    </g>
  </g>

  <!-- VS circle -->
  <circle cx="380" cy="165" r="18" fill="#11376e"/>
  <text x="380" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">VS</text>

  <!-- Card Opção 2 -->
  <g transform="translate(410, 70)" filter="url(#boxShadow)">
    <rect width="300" height="190" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="20" y="20" width="260" height="75" rx="8" fill="#f1f5f9"/>
    <text x="150" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="13" fill="#64748b" text-anchor="middle">Apartamento em Pinheiros</text>
    
    <text x="24" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="15" font-weight="bold" fill="#1f2328">Opção 2</text>
    <text x="24" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="12" fill="#656d76">R$ 390 / noite</text>
    
    <g transform="translate(24, 155)">
      <rect width="125" height="26" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="62" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI'" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">★ 4.8 (120 avaliações)</text>
    </g>
  </g>
</svg>
